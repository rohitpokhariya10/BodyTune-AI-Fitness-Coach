name: bodytune-backend

services:
  api:
    build:
      context: .
      target: build
    command: npm start
    init: true
    restart: unless-stopped
    user: node
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: 9000
      MONGODB_URI: mongodb://mongo:27017/bodytune
    ports:
      - '${PORT:-9000}:9000'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9000/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MONGODB_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

volumes:
  mongo-data:
